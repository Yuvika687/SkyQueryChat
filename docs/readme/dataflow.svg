<text x="850.6666666666667" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#B8C3DA" text-anchor="start" >per-visitor rate limits,</text>
<text x="850.6666666666667" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#B8C3DA" text-anchor="start" >one shared AI quota</text>
</g>
<line x1="1024.6666666666667" y1="255" x2="1042.0" y2="255" stroke="#1f2d4d" stroke-width="3"/><circle r="5" fill="#60A5FA" filter="url(#glow)" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite" path="M1024.6666666666667 255 H1042.0"/></circle>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.571;1" dur="1.40s" begin="0s" fill="freeze"/><rect x="1042.0" y="200" width="190" height="110" rx="16" fill="#0d1830" stroke="#1f2d4d"/><rect x="1042.0" y="200" width="190" height="110" rx="16" fill="none" stroke="#A3E635" opacity="0" stroke-width="2"><animate attributeName="opacity" values="0;0.9;0" begin="1.7999999999999998s" dur="2.4s" repeatCount="indefinite"/></rect><text x="1058.0" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#F2F5FB" text-anchor="start" >Next.js site</text><text x="1058.0" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#A3E635" text-anchor="start" >Vercel · Lighthouse 99–100</text>
<text x="1058.0" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#B8C3DA" text-anchor="start" >Ask · Explore · City</text>
