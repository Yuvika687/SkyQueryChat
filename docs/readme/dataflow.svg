<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.250;1" dur="0.80s" begin="0s" fill="freeze"/><rect x="420.0" y="200" width="190" height="110" rx="16" fill="#0d1830" stroke="#1f2d4d"/><rect x="420.0" y="200" width="190" height="110" rx="16" fill="none" stroke="#2DD4BF" opacity="0" stroke-width="2"><animate attributeName="opacity" values="0;0.9;0" begin="0.0s" dur="2.4s" repeatCount="indefinite"/></rect><text x="436.0" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#F2F5FB" text-anchor="start" >Daily refresh</text><text x="436.0" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#2DD4BF" text-anchor="start" >GitHub Actions · 7:30 AM IST</text>
<text x="436.0" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#B8C3DA" text-anchor="start" >dates never move back,</text>
<text x="436.0" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#B8C3DA" text-anchor="start" >published values unchanged</text>
</g>
<line x1="610.0" y1="255" x2="627.3333333333334" y2="255" stroke="#1f2d4d" stroke-width="3"/><circle r="5" fill="#2DD4BF" filter="url(#glow)" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="1.6s" begin="0.0s" repeatCount="indefinite" path="M610.0 255 H627.3333333333334"/></circle>
<g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.400;1" dur="1.00s" begin="0s" fill="freeze"/><rect x="627.3333333333334" y="200" width="190" height="110" rx="16" fill="#0d1830" stroke="#1f2d4d"/><rect x="627.3333333333334" y="200" width="190" height="110" rx="16" fill="none" stroke="#FACC15" opacity="0" stroke-width="2"><animate attributeName="opacity" values="0;0.9;0" begin="0.6s" dur="2.4s" repeatCount="indefinite"/></rect><text x="643.3333333333334" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#F2F5FB" text-anchor="start" >Parquet + DuckDB</text><text x="643.3333333333334" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#FACC15" text-anchor="start" >cleaned · never imputed</text>
<text x="643.3333333333334" y="276" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#B8C3DA" text-anchor="start" >invalid values counted,</text>
<text x="643.3333333333334" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#B8C3DA" text-anchor="start" >faults flagged, not hidden</text>
</g>
