<path id="p1" d="M298 222 C360 222 360 255 420 255" fill="none" stroke="#FACC15" stroke-opacity="0.35" stroke-width="2"/>
<circle r="5" fill="#FACC15" filter="url(#glow)" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="2.4s" begin="0.5s" repeatCount="indefinite" path="M298 222 C360 222 360 255 420 255"/></circle>
