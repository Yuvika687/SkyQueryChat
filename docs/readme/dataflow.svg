<circle r="5" fill="#60A5FA" filter="url(#glow)" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="2.4s" begin="1.0s" repeatCount="indefinite" path="M298 280 C360 280 360 255 420 255"/></circle>
<rect x="48" y="314" width="250" height="48" rx="12" fill="#0d1830" stroke="#1f2d4d"/><rect x="48" y="314" width="5" height="48" rx="2" fill="#A3E635"/><text x="66" y="335" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#F2F5FB" text-anchor="start" >OpenCity</text><text x="66" y="353" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#B8C3DA" text-anchor="start" >Delhi station files</text>
<path id="p3" d="M298 338 C360 338 360 255 420 255" fill="none" stroke="#A3E635" stroke-opacity="0.35" stroke-width="2"/>
