<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
<title id="t">SkyQueryChat data flow</title><desc id="d">OpenAQ, CPCB bulletins, Open-Meteo and OpenCity feed a daily GitHub Actions refresh into Parquet and DuckDB, served by FastAPI with Server-Sent Events on Render to the Next.js site on Vercel.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1428"/><stop offset="1" stop-color="#060A14"/></linearGradient>
<radialGradient id="g1" cx="0.08" cy="0" r="0.6"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.20"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="1" cy="1" r="0.6"><stop offset="0" stop-color="#60A5FA" stop-opacity="0.18"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-opacity="0.35"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect width="1280" height="400" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="400" fill="url(#bg)"/><rect width="1280" height="400" fill="url(#grid)"/>
<rect width="1280" height="400" fill="url(#g1)"/><rect width="1280" height="400" fill="url(#g2)"/>
<rect x="0" y="0" width="1280" height="2" fill="url(#acc)" opacity="0.8"><animate attributeName="opacity" values="0.35;0.9;0.35" dur="4s" repeatCount="indefinite"/></rect>
<text x="48" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="3" fill="#2DD4BF">DATA FLOW</text><text x="46" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Real data, refreshed every morning</text>
<rect x="48" y="140" width="250" height="48" rx="12" fill="#0d1830" stroke="#1f2d4d"/><rect x="48" y="140" width="5" height="48" rx="2" fill="#2DD4BF"/><text x="66" y="161" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#F2F5FB" text-anchor="start" >OpenAQ</text><text x="66" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#B8C3DA" text-anchor="start" >measured PM · archive + API</text>
<path id="p0" d="M298 164 C360 164 360 255 420 255" fill="none" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="2"/>
<circle r="5" fill="#2DD4BF" filter="url(#glow)" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" path="M298 164 C360 164 360 255 420 255"/></circle>
