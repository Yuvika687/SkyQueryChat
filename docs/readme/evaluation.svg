<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="t d">
<title id="t">SkyQueryChat evaluation</title><desc id="d">First-pass scores: main 47 of 51, unseen holdout 11 of 11, first unseen 11 of 11, Diwali 2026 9 of 9, statistics and comparisons 11 of 12, conversation 14 of 15; 100% of numbers traced in every set.</desc>
<defs>
